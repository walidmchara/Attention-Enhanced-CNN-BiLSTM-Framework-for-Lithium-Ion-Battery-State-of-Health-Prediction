name: Original NASA MAT notebook reproduction checks
on:
  push:
    paths:
      - 'scripts/restore_original_nasa_mat.py'
      - 'scripts/legacy_mat_recovery.py'
      - 'notebooks/REPRO_ORIGINAL_MAT_*_COLAB.ipynb'
      - 'tests/test_legacy_mat_reproduction.py'
      - '.github/workflows/legacy-mat-reproduction.yml'
  pull_request:
    paths:
      - 'scripts/restore_original_nasa_mat.py'
      - 'scripts/legacy_mat_recovery.py'
      - 'notebooks/REPRO_ORIGINAL_MAT_*_COLAB.ipynb'
      - 'tests/test_legacy_mat_reproduction.py'
      - '.github/workflows/legacy-mat-reproduction.yml'
jobs:
  original-mat-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install compatible CPU stack
        run: python -m pip install -q "tensorflow-cpu>=2.18,<2.22" scipy numpy pandas scikit-learn pytest
      - name: Syntax and source parity + model/optimizer recovery
        env:
          CUDA_VISIBLE_DEVICES: "-1"
          TF_CPP_MIN_LOG_LEVEL: "3"
        run: |
          python -m py_compile scripts/restore_original_nasa_mat.py scripts/legacy_mat_recovery.py
          python -m pytest -q tests/test_legacy_mat_reproduction.py
